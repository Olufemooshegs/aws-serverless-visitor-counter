<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Counter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .card {
      background: rgba(0, 0, 0, 0.25);
      padding: 3rem 4rem;
      border-radius: 1rem;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 400; opacity: 0.9; }
    .count { font-size: 5rem; font-weight: 700; margin: 0; }
    .status { margin-top: 1rem; font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are visitor number</h1>
    <p class="count" id="count">…</p>
    <p class="status" id="status">Connecting…</p>
  </div>

  <script>
    // Terraform substitutes this at deploy time
    const API_URL = "${api_url}";

    async function fetchCount() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        document.getElementById("count").textContent = data.count.toLocaleString();
        document.getElementById("status").textContent = "Thanks for stopping by!";
      } catch (err) {
        console.error(err);
        document.getElementById("count").textContent = "?";
        document.getElementById("status").textContent = "Could not reach the API.";
      }
    }

    fetchCount();
</script>
</body>
</html>
